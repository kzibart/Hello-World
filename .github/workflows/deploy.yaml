name: Deploy Arcade Game

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pygbag
        run: pip install pygbag arcade

      - name: Build
        # This creates the 'build/web' folder
        run: pygbag --build .

      - name: The "Manual Override"
        run: |
          # 1. Force the 'friendly' BrowserFS link into the HTML
          sed -i 's/cdn.jsdelivr.net/cdnjs.cloudflare.com\/ajax\/libs/g' build/web/index.html
          
          # 2. Force main.py into the root of the web folder
          cp main.py build/web/
          
          # 3. If it looks for 'assets', give it what it wants
          mkdir -p build/web/assets
          cp main.py build/web/assets/

      - name: Push to Production
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages